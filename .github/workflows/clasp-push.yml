# Pushes gas/ to the Apps Script project after the tests pass, so a deploy does not need this PC.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLASP_JSON    the contents of gas/.clasp.json (script id and workbook id, gitignored)
#   CLASPRC_JSON  the contents of ~/.clasprc.json after clasp login (a Google refresh token)
# deploy.bat still pushes the same code from the PC, the second push is harmless.
name: clasp push
on:
  push:
    branches: [main]
    paths: ['gas/**']
permissions:
  contents: read
concurrency: clasp-push
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node test/run_all.js
      - name: Check the secrets exist
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASP_JSON" ] || [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Set the CLASP_JSON and CLASPRC_JSON repository secrets, see the comment at the top of this file."
            exit 1
          fi
      - run: npm install --global @google/clasp@3.4.1
      - name: clasp push
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASP_JSON" > gas/.clasp.json
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cd gas
          clasp push -f
      - name: Remove credentials
        if: always()
        run: rm -f gas/.clasp.json "$HOME/.clasprc.json"
